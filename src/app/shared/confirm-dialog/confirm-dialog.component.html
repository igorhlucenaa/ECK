<div class="confirm-dialog" [class.confirm-dialog--warning]="data.type === 'warning'">
  <!-- Ícone -->
  <div class="confirm-dialog__icon-wrap">
    <mat-icon class="confirm-dialog__icon">{{ icon }}</mat-icon>
  </div>

  <!-- Título -->
  <h2 mat-dialog-title class="confirm-dialog__title">{{ title }}</h2>

  <!-- Conteúdo -->
  <mat-dialog-content class="confirm-dialog__content">
    <p *ngIf="data.message" class="confirm-dialog__message">{{ data.message }}</p>

    <!-- Nome do item destacado -->
    <div *ngIf="data.itemName" class="confirm-dialog__item-box">
      <mat-icon class="confirm-dialog__item-icon">label</mat-icon>
      <span class="confirm-dialog__item-name">{{ data.itemName }}</span>
    </div>

    <p class="confirm-dialog__warning">Esta ação <strong>não pode ser desfeita</strong>.</p>
  </mat-dialog-content>

  <!-- Ações -->
  <mat-dialog-actions class="confirm-dialog__actions" align="end">
    <button mat-stroked-button class="confirm-dialog__cancel-btn" (click)="dialogRef.close(false)">
      <mat-icon>close</mat-icon>
      {{ cancelText }}
    </button>
    <button mat-flat-button class="confirm-dialog__confirm-btn" (click)="dialogRef.close(true)">
      <mat-icon>{{ icon }}</mat-icon>
      {{ confirmText }}
    </button>
  </mat-dialog-actions>
</div>
