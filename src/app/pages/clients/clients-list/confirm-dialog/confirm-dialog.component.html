<h2 mat-dialog-title>{{ 'Confirmação' | translate }}</h2>
<mat-dialog-content style="padding-top: 5px;">
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'Cancelar' | translate }}</button>
  <button mat-button color="warn" (click)="onConfirm()">{{ 'Confirmar' | translate }}</button>
</mat-dialog-actions>
