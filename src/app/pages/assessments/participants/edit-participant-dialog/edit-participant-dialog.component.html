<div class="epd">

  <!-- Header -->
  <div class="epd__header">
    <div class="epd__header-icon">
      <mat-icon>edit</mat-icon>
    </div>
    <div class="epd__header-text">
      <h2>Editar Participante</h2>
      <p>Altere o nome, e-mail e/ou categoria do participante</p>
    </div>
  </div>

  <mat-dialog-content class="epd__body">
    <mat-form-field appearance="outline" class="epd__field">
      <mat-label>Nome</mat-label>
      <mat-icon matPrefix class="epd__prefix-icon">person</mat-icon>
      <input matInput [(ngModel)]="name" placeholder="Nome completo"
             (keydown.enter)="confirm()" (keydown.escape)="dialogRef.close(null)" autofocus />
    </mat-form-field>

    <mat-form-field appearance="outline" class="epd__field">
      <mat-label>E-mail</mat-label>
      <mat-icon matPrefix class="epd__prefix-icon">email</mat-icon>
      <input matInput [(ngModel)]="email" placeholder="email@exemplo.com" type="email"
             (keydown.enter)="confirm()" (keydown.escape)="dialogRef.close(null)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="epd__field">
      <mat-label>Categoria</mat-label>
      <mat-icon matPrefix class="epd__prefix-icon">group</mat-icon>
      <mat-select [(ngModel)]="category">
        <mat-option
          value="Avaliado"
          [disabled]="!canSelectAvaliado && category !== 'Avaliado'">
          Avaliado
        </mat-option>
        <mat-option value="Gestor">Gestor</mat-option>
        <mat-option value="Par">Par</mat-option>
        <mat-option value="Subordinado">Subordinado</mat-option>
        <mat-option value="Outros">Outros</mat-option>
      </mat-select>
      <mat-hint *ngIf="!canSelectAvaliado && existingEvaluateeName">
        Este projeto já possui o avaliado {{ existingEvaluateeName }}.
      </mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <!-- Actions -->
  <div class="epd__actions">
    <button mat-button class="epd__btn-cancel" (click)="dialogRef.close(null)">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
    <button mat-raised-button class="epd__btn-confirm" [disabled]="!isValid" (click)="confirm()">
      <mat-icon>check</mat-icon>
      Salvar
    </button>
  </div>

</div>
