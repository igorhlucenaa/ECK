<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <defs>
    <clipPath id="cp-us"><rect width="60" height="40" rx="6"/></clipPath>
  </defs>
  <!-- Red background (stripes) -->
  <rect width="60" height="40" rx="6" fill="#B22234"/>
  <!-- White stripes -->
  <rect x="0" y="3.077"  width="60" height="3.077" fill="#fff" clip-path="url(#cp-us)"/>
  <rect x="0" y="9.231"  width="60" height="3.077" fill="#fff" clip-path="url(#cp-us)"/>
  <rect x="0" y="15.385" width="60" height="3.077" fill="#fff" clip-path="url(#cp-us)"/>
  <rect x="0" y="21.538" width="60" height="3.077" fill="#fff" clip-path="url(#cp-us)"/>
  <rect x="0" y="27.692" width="60" height="3.077" fill="#fff" clip-path="url(#cp-us)"/>
  <rect x="0" y="33.846" width="60" height="3.077" fill="#fff" clip-path="url(#cp-us)"/>
  <!-- Blue canton (top-left, covers 7 stripes height = 7*40/13 ≈ 21.54, width = 40%) -->
  <rect x="0" y="0" width="24" height="21.538" fill="#3C3B6E" clip-path="url(#cp-us)"/>
  <!-- Stars: 5 columns offset rows -->
  <!-- Row 1 (y=2.2): 6 stars -->
  <circle cx="2.4"  cy="2.2" r="1.2" fill="#fff"/>
  <circle cx="6.8"  cy="2.2" r="1.2" fill="#fff"/>
  <circle cx="11.2" cy="2.2" r="1.2" fill="#fff"/>
  <circle cx="15.6" cy="2.2" r="1.2" fill="#fff"/>
  <circle cx="20.0" cy="2.2" r="1.2" fill="#fff"/>
  <!-- Row 2 (y=5.1): 5 stars offset -->
  <circle cx="4.6"  cy="5.1" r="1.2" fill="#fff"/>
  <circle cx="9.0"  cy="5.1" r="1.2" fill="#fff"/>
  <circle cx="13.4" cy="5.1" r="1.2" fill="#fff"/>
  <circle cx="17.8" cy="5.1" r="1.2" fill="#fff"/>
  <circle cx="22.2" cy="5.1" r="1.2" fill="#fff"/>
  <!-- Row 3 (y=8.0): 6 stars -->
  <circle cx="2.4"  cy="8.0" r="1.2" fill="#fff"/>
  <circle cx="6.8"  cy="8.0" r="1.2" fill="#fff"/>
  <circle cx="11.2" cy="8.0" r="1.2" fill="#fff"/>
  <circle cx="15.6" cy="8.0" r="1.2" fill="#fff"/>
  <circle cx="20.0" cy="8.0" r="1.2" fill="#fff"/>
  <!-- Row 4 (y=10.9): 5 stars offset -->
  <circle cx="4.6"  cy="10.9" r="1.2" fill="#fff"/>
  <circle cx="9.0"  cy="10.9" r="1.2" fill="#fff"/>
  <circle cx="13.4" cy="10.9" r="1.2" fill="#fff"/>
  <circle cx="17.8" cy="10.9" r="1.2" fill="#fff"/>
  <circle cx="22.2" cy="10.9" r="1.2" fill="#fff"/>
  <!-- Row 5 (y=13.8): 6 stars -->
  <circle cx="2.4"  cy="13.8" r="1.2" fill="#fff"/>
  <circle cx="6.8"  cy="13.8" r="1.2" fill="#fff"/>
  <circle cx="11.2" cy="13.8" r="1.2" fill="#fff"/>
  <circle cx="15.6" cy="13.8" r="1.2" fill="#fff"/>
  <circle cx="20.0" cy="13.8" r="1.2" fill="#fff"/>
  <!-- Row 6 (y=16.7): 5 stars offset -->
  <circle cx="4.6"  cy="16.7" r="1.2" fill="#fff"/>
  <circle cx="9.0"  cy="16.7" r="1.2" fill="#fff"/>
  <circle cx="13.4" cy="16.7" r="1.2" fill="#fff"/>
  <circle cx="17.8" cy="16.7" r="1.2" fill="#fff"/>
  <circle cx="22.2" cy="16.7" r="1.2" fill="#fff"/>
  <!-- Row 7 (y=19.6): 6 stars -->
  <circle cx="2.4"  cy="19.6" r="1.2" fill="#fff"/>
  <circle cx="6.8"  cy="19.6" r="1.2" fill="#fff"/>
  <circle cx="11.2" cy="19.6" r="1.2" fill="#fff"/>
  <circle cx="15.6" cy="19.6" r="1.2" fill="#fff"/>
