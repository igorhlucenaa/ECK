<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <defs>
    <clipPath id="cp-es"><rect width="60" height="40" rx="6"/></clipPath>
  </defs>
  <!-- Red background -->
  <rect width="60" height="40" rx="6" fill="#C60B1E"/>
  <!-- Yellow center band (25% to 75% = y:10 to y:30) -->
  <rect x="0" y="10" width="60" height="20" fill="#FFC400" clip-path="url(#cp-es)"/>
  <!-- Coat of arms (simplified, positioned at left-center of yellow band) -->
  <!-- Left pillar -->
  <rect x="17" y="12" width="3" height="16" rx="1" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <rect x="16" y="11" width="5" height="2"  rx="0.5" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <rect x="16" y="27" width="5" height="2"  rx="0.5" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <!-- Right pillar -->
  <rect x="26" y="12" width="3" height="16" rx="1" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <rect x="25" y="11" width="5" height="2"  rx="0.5" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <rect x="25" y="27" width="5" height="2"  rx="0.5" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <!-- Shield -->
  <rect x="19.5" y="13" width="7" height="9" rx="1" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <!-- Shield: left half (castle) -->
  <rect x="19.5" y="13" width="3.5" height="9" rx="1" fill="#8B0000" clip-path="url(#cp-es)"/>
  <!-- Shield: right half (lion) -->
  <rect x="23"   y="13" width="3.5" height="9" rx="1" fill="#A00010" clip-path="url(#cp-es)"/>
  <!-- Crown on top of shield -->
  <rect x="20.5" y="11.5" width="5" height="2" rx="1" fill="#C60B1E" clip-path="url(#cp-es)"/>
  <circle cx="23" cy="11" r="1.2" fill="#C60B1E" clip-path="url(#cp-es)"/>
</svg>
